<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amina & Tariq | Wedding Invitation</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Great+Vibes&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-green: #2d5a27;
            --light-green: #e8f5e9;
            --gold: #d4af37;
            --white: #ffffff;
            --text-dark: #2c3e50;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Montserrat', sans-serif; background-color: var(--deep-green); color: var(--text-dark); overflow-x: hidden; }

        /* Full Screen Pages */
        .page { height: 100vh; width: 100vw; display: flex; justify-content: center; align-items: center; position: relative; scroll-snap-align: start; background: var(--white); }
        .scroll-container { height: 100vh; overflow-y: scroll; scroll-snap-type: y mandatory; }

        /* Envelope Animation */
        .envelope-container { position: absolute; z-index: 100; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; pointer-events: none; transition: transform 1s ease; }
        .envelope-flap { position: absolute; top: 30%; width: 300px; height: 150px; background: var(--deep-green); clip-path: polygon(0 0, 100% 0, 50% 100%); transition: transform 1s ease; z-index: 101; }
        .envelope-body { position: absolute; top: 30%; width: 300px; height: 200px; background: #244a20; z-index: 100; border: 2px solid var(--gold); }
        
        .page.open .envelope-flap { transform: rotateX(180deg); transform-origin: top; }

        /* Content Styling */
        .card { text-align: center; max-width: 500px; padding: 40px; }
        h1 { font-family: 'Great Vibes', cursive; font-size: 3.5rem; color: var(--deep-green); }
        .gold-divider { height: 2px; width: 50px; background: var(--gold); margin: 20px auto; }
        .location-link { display: inline-block; padding: 15px 30px; background: var(--deep-green); color: var(--white); text-decoration: none; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<div class="scroll-container">
    <!-- Page 1: Names -->
    <section class="page" id="page1">
        <div class="envelope-container">
            <div class="envelope-flap" id="envelope-flap"></div>
            <div class="envelope-body"></div>
        </div>
        <div class="card">
            <h1>Amina & Tariq</h1>
            <p>We are getting married!</p>
        </div>
    </section>

    <!-- Page 2: Invitation -->
    <section class="page" id="page2">
        <div class="card">
            <h2>The Invitation</h2>
            <div class="gold-divider"></div>
            <p>Together with their families, we invite you to join us for our Nikah celebration.</p>
        </div>
    </section>

    <!-- Page 3: Itinerary -->
    <section class="page" id="page3">
        <div class="card">
            <h2>Itinerary</h2>
            <div class="gold-divider"></div>
            <p><strong>3:00 PM:</strong> Nikah Ceremony</p>
            <p><strong>6:00 PM:</strong> Dinner Reception</p>
        </div>
    </section>

    <!-- Page 4: Location -->
    <section class="page" id="page4">
        <div class="card">
            <h2>Location</h2>
            <div class="gold-divider"></div>
            <p>The Grand Garden Venue</p>
            <a href="#" class="location-link">Click for Map</a>
        </div>
    </section>
</div>

<script>
    const container = document.querySelector('.scroll-container');
    const flap = document.getElementById('envelope-flap');
    
    container.addEventListener('scroll', () => {
        if (container.scrollTop > 50) {
            flap.style.transform = 'rotateX(180deg)';
        } else {
            flap.style.transform = 'rotateX(0deg)';
        }
    });
</script>

</body>
</html>
